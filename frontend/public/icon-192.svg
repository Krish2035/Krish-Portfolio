<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="primaryGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="url(#primaryGrad192)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Code Bracket Left -->
  <path d="M 62 70 L 44 96 L 62 122" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- Central Letter K -->
  <g filter="url(#glow192)">
    <path d="M 82 66 L 82 126" fill="none" stroke="url(#primaryGrad192)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 112 68 L 86 96 L 114 126" fill="none" stroke="url(#primaryGrad192)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code Bracket Right -->
  <path d="M 130 70 L 148 96 L 130 122" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Glow Dot -->
  <circle cx="146" cy="46" r="5" fill="#14b8a6"/>
</svg>
